# Local production-like stack. Requires cybersentinel-backend/.env with Supabase DATABASE_URL.
# Usage: docker compose up --build

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: cybersentinel-backend:local
    ports:
      - "8000:8000"
    env_file:
      - cybersentinel-backend/.env
    environment:
      DEBUG: "false"
      HOST: 0.0.0.0
      PORT: 8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
