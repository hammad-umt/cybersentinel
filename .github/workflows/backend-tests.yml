name: Backend Tests

on:
  push:
    paths:
      - "cybersentinel-backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "cybersentinel-backend/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cybersentinel-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cybersentinel-backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest tests/ -v --tb=short
